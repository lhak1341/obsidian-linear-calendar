name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # esbuild transpiles without typechecking, so `build` alone would happily
      # ship a release containing type errors, lint violations, or red tests.
      - name: Typecheck, lint and test
        run: bun run check

      - name: Build
        run: bun run build

      # Lets anyone check a downloaded asset against this repository with
      # `gh attestation verify <file> --repo lhak1341/obsidian-linear-calendar`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            main.js manifest.json styles.css \
            --title "$tag" \
            --generate-notes
